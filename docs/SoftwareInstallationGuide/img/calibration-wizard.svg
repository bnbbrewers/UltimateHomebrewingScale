<svg xmlns="http://www.w3.org/2000/svg" width="720" height="480" viewBox="0 0 720 480" role="img" aria-labelledby="title desc">
  <title id="title">Scale calibration wizard</title>
  <desc id="desc">The calibration wizard with four weight points from zero grams to twenty kilograms.</desc>
  <rect width="720" height="480" fill="#f8fbf8"/>
  <rect x="58" y="70" width="604" height="340" rx="20" fill="#ffffff" stroke="#d9ded8" stroke-width="3"/>
  <rect x="113" y="275" width="258" height="36" rx="12" fill="#25342e"/>
  <rect x="145" y="196" width="194" height="80" rx="18" fill="#e8f1fb" stroke="#b9d0e8" stroke-width="3"/>
  <rect x="177" y="218" width="130" height="34" rx="8" fill="#ffffff"/>
  <text x="242" y="241" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="850" fill="#1f4f82">5000 g</text>
  <circle cx="498" cy="228" r="88" fill="#f47c20"/>
  <circle cx="498" cy="228" r="70" fill="#202421"/>
  <rect x="445" y="189" width="106" height="78" rx="8" fill="#ffffff"/>
  <text x="498" y="211" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="800" fill="#5f6c66">Step 3/4</text>
  <text x="498" y="241" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="21" font-weight="850" fill="#15563f">5000 g</text>
  <rect x="463" y="252" width="70" height="8" rx="4" fill="#1f7a5b"/>
  <g font-family="Inter, Arial, sans-serif" font-size="16" font-weight="800" text-anchor="middle">
    <circle cx="159" cy="350" r="28" fill="#e7f3ee" stroke="#b8d7ca"/>
    <text x="159" y="356" fill="#15563f">0g</text>
    <circle cx="294" cy="350" r="28" fill="#fff1db" stroke="#ebc68b"/>
    <text x="294" y="356" fill="#8a4b14">500g</text>
    <circle cx="429" cy="350" r="28" fill="#e8f1fb" stroke="#b9d0e8"/>
    <text x="429" y="356" fill="#1f4f82">5kg</text>
    <circle cx="564" cy="350" r="28" fill="#e7f3ee" stroke="#b8d7ca"/>
    <text x="564" y="356" fill="#15563f">20kg</text>
  </g>
  <path d="M187 350h79M322 350h79M457 350h79" stroke="#d9ded8" stroke-width="5" stroke-linecap="round"/>
  <text x="360" y="121" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="26" font-weight="850" fill="#1c2320">Calibrate every point carefully</text>
  <text x="360" y="151" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="650" fill="#5f6c66">Place weight, adjust target with the Dial, press Start, keep still for 30 seconds</text>
</svg>
