name: Repack M5Dial firmware

on:
  push:
    tags:
      - 'v*'
      - 'pre-v*'
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag_name:
        description: Tag to repack
        required: true
      prerelease:
        description: Build as prerelease channel
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  repack:
    name: Repack firmware from main tag
    runs-on: ubuntu-latest
    outputs:
      tag_name: ${{ steps.release_names.outputs.tag_name }}
      release_channel: ${{ steps.release_names.outputs.release_channel }}
      publish_stable_latest: ${{ steps.release_names.outputs.publish_stable_latest }}

    steps:
      - name: Checkout tagged commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.release.tag_name || inputs.tag_name || github.ref }}

      - name: Verify tag commit belongs to main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          HEAD_SHA=$(git rev-parse HEAD)
          git merge-base --is-ancestor "$HEAD_SHA" origin/main

      - name: Build pinned mpy-cross compiler
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .ci-mpy-cross
          mkdir -p .ci-mpy-cross
          git clone --depth 1 --branch 2.4.2 \
            https://github.com/m5stack/uiflow-micropython.git \
            .ci-mpy-cross/uiflow-micropython
          git -C .ci-mpy-cross/uiflow-micropython submodule update --init --depth 1 micropython
          make -C .ci-mpy-cross/uiflow-micropython/m5stack mpy-cross
          test -x .ci-mpy-cross/uiflow-micropython/micropython/mpy-cross/mpy-cross

      - name: Install ESP-IDF Python tools
        uses: espressif/install-esp-idf-action@v1
        with:
          version: v5.4.2

      - name: Prepare release names
        id: release_names
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "release" ]; then
            TAG_NAME="${{ github.event.release.tag_name }}"
            IS_PRERELEASE="${{ github.event.release.prerelease }}"
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG_NAME="${{ inputs.tag_name }}"
            IS_PRERELEASE="${{ inputs.prerelease }}"
          else
            TAG_NAME="${GITHUB_REF_NAME}"
            IS_PRERELEASE="false"
            if [[ "$TAG_NAME" == pre-v* || "$TAG_NAME" == *-alpha* || "$TAG_NAME" == *-beta* || "$TAG_NAME" == *-rc* ]]; then
              IS_PRERELEASE="true"
            fi
          fi
          if [ "$IS_PRERELEASE" = "true" ]; then
            echo "RELEASE_CHANNEL=prerelease" >> "$GITHUB_ENV"
            echo "PUBLISH_STABLE_LATEST=false" >> "$GITHUB_ENV"
            RELEASE_CHANNEL="prerelease"
            PUBLISH_STABLE_LATEST="false"
          else
            echo "RELEASE_CHANNEL=stable" >> "$GITHUB_ENV"
            echo "PUBLISH_STABLE_LATEST=true" >> "$GITHUB_ENV"
            RELEASE_CHANNEL="stable"
            PUBLISH_STABLE_LATEST="true"
          fi
          echo "TAG_NAME=${TAG_NAME}" >> "$GITHUB_ENV"
          echo "tag_name=${TAG_NAME}" >> "$GITHUB_OUTPUT"
          echo "release_channel=${RELEASE_CHANNEL}" >> "$GITHUB_OUTPUT"
          echo "publish_stable_latest=${PUBLISH_STABLE_LATEST}" >> "$GITHUB_OUTPUT"
          echo "HEAD_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          echo "SHORT_SHA=$(git rev-parse --short HEAD)" >> "$GITHUB_ENV"

      - name: Unpack repack base
        shell: bash
        run: |
          set -euo pipefail
          rm -rf dist
          mkdir -p dist/base dist/fs-user dist/out
          unzip -q firmware/UHS-m5dial-repack-base.zip -d dist/base
          test -f dist/base/repack-base/artifacts/sdkconfig
          test -f dist/base/repack-base/artifacts/bootloader/bootloader.bin
          test -f dist/base/repack-base/artifacts/partition_table/partition-table.bin
          test -f dist/base/repack-base/artifacts/nvs.bin
          test -f dist/base/repack-base/artifacts/micropython.bin
          test -f dist/base/repack-base/artifacts/fs-system.bin
          test -f dist/base/repack-base/tools/fs_packed.py
          test -f dist/base/repack-base/tools/littlefs2
          test -f dist/base/repack-base/tools/makeimg.py
          test -f dist/base/repack-base/version.txt
          test -f dist/base/repack-base/micropython/tools/uf2conv.py
          test -f dist/base/repack-base/micropython/tools/uf2families.json
          chmod +x dist/base/repack-base/tools/littlefs2

      - name: Build runtime file artifact
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/build_runtime.py \
            --source-root "$GITHUB_WORKSPACE" \
            --staging-root "$GITHUB_WORKSPACE/dist/fs-user" \
            --version "$TAG_NAME" \
            --mpy-cross "$GITHUB_WORKSPACE/.ci-mpy-cross/uiflow-micropython/micropython/mpy-cross/mpy-cross"
          test -f dist/fs-user/main.py
          test -f dist/fs-user/config.py.example
          test ! -e dist/fs-user/config.py
          [ ! -d dist/fs-user/docs ]
          [ ! -d dist/fs-user/firmware ]
          [ ! -d dist/fs-user/.github ]
          [ ! -d dist/fs-user/tools ]
          [ ! -f dist/fs-user/.gitignore ]
          if find dist/fs-user -type f -name "*.py" \
              ! -path "dist/fs-user/main.py" \
              ! -path "dist/fs-user/config.py.example" | grep -q .; then
            echo "Unexpected Python source in runtime staging." >&2
            find dist/fs-user -type f -name "*.py" >&2
            exit 1
          fi
          python3 - <<'PY'
          import os
          from pathlib import Path
          from zipfile import ZIP_DEFLATED, ZipFile

          src = Path("dist/fs-user")
          out = Path("dist/out") / f"UHS-app-files-{os.environ['TAG_NAME']}.zip"
          with ZipFile(out, "w", ZIP_DEFLATED) as archive:
              for path in sorted(p for p in src.rglob("*") if p.is_file()):
                  archive.write(path, path.relative_to(src).as_posix())
          print(f"Runtime files: {sum(1 for p in src.rglob('*') if p.is_file())}")
          print(f"Runtime archive: {out}")
          PY

      - name: Repack firmware
        shell: bash
        run: |
          set -euo pipefail
          cd dist/base/repack-base
          rm -f artifacts/fs-user.bin
          set +e
          python3 tools/fs_packed.py \
            tools/littlefs2 \
            dial \
            "$GITHUB_WORKSPACE/dist/fs-user" \
            artifacts/fs-user.bin \
            artifacts/partition_table/partition-table.bin 2>&1 | tee "$GITHUB_WORKSPACE/dist/out/fs-packed.log"
          FS_PACK_STATUS=${PIPESTATUS[0]}
          set -e
          if [ "$FS_PACK_STATUS" -ne 0 ]; then
            exit "$FS_PACK_STATUS"
          fi
          if grep -E "pack failed|write error|No more free space" "$GITHUB_WORKSPACE/dist/out/fs-packed.log"; then
            exit 1
          fi
          test -s artifacts/fs-user.bin
          python3 tools/makeimg.py \
            artifacts/sdkconfig \
            artifacts/bootloader/bootloader.bin \
            artifacts/partition_table/partition-table.bin \
            artifacts/nvs.bin \
            artifacts/micropython.bin \
            artifacts/fs-system.bin \
            artifacts/fs-user.bin \
            dial \
            0 \
            "$GITHUB_WORKSPACE/dist/out/UHS-firmwareM5Dial.bin" \
            "$GITHUB_WORKSPACE/dist/out/UHS-firmwareM5Dial.uf2"

      - name: Write release metadata
        shell: bash
        run: |
          set -euo pipefail
          cd dist/out
          sha256sum UHS-firmwareM5Dial.bin > UHS-firmwareM5Dial.sha256
          python3 - <<'PY'
          import hashlib
          import json
          import os
          import sys
          import subprocess
          import tarfile
          from pathlib import Path

          sys.path.insert(0, os.environ["GITHUB_WORKSPACE"])
          from tools.build_runtime import plan_git_diff

          firmware = Path("UHS-firmwareM5Dial.bin")
          sha256 = Path("UHS-firmwareM5Dial.sha256").read_text(encoding="utf-8").split()[0]
          included_count = sum(1 for _ in Path("../fs-user").rglob("*") if _.is_file())
          code_archive = f"UHS-app-files-{os.environ['TAG_NAME']}.zip"
          update_archive = f"uhs-update-diff-{os.environ['TAG_NAME']}.tar"
          web_download_base = "https://bnbbrewers.github.io/UltimateHomebrewingScale/SoftwareInstallationGuide/latest"

          try:
              base_version = subprocess.check_output(
                  ["git", "describe", "--tags", "--match", "v*", "--abbrev=0", f"{os.environ['TAG_NAME']}^"],
                  text=True,
              ).strip()
          except subprocess.CalledProcessError as exc:
              raise SystemExit("No previous tag found; publish full firmware instead of app update") from exc

          diff_plan = plan_git_diff(
              source_root=Path(os.environ["GITHUB_WORKSPACE"]),
              base_ref=base_version,
              head_ref=os.environ["TAG_NAME"],
              staging_root=Path("../fs-user"),
          )
          archive_path = Path(update_archive)
          with tarfile.open(archive_path, "w") as archive:
              for rel_path in diff_plan.archive_paths:
                  archive.add(Path("../fs-user") / rel_path, arcname=rel_path)
          archive_sha256 = hashlib.sha256(archive_path.read_bytes()).hexdigest()
          archive_url = (
              "https://github.com/bnbbrewers/UltimateHomebrewingScale/"
              f"releases/download/{os.environ['TAG_NAME']}/{update_archive}"
          )
          build_manifest = {
              "name": "Ultimate Homebrewing Scale M5Dial firmware",
              "tag": os.environ["TAG_NAME"],
              "commit": os.environ["HEAD_SHA"],
              "short_commit": os.environ["SHORT_SHA"],
              "source_branch": "main",
              "firmware": "UHS-firmwareM5Dial.bin",
              "code": code_archive,
              "update_archive": update_archive,
              "updater_manifest": "uhs-update-manifest.json",
              "web_install_manifest": "UHS-web-install-manifest.json",
              "web_install_url": f"{web_download_base}/UHS-web-install-manifest.json",
              "sha256": sha256,
              "size": firmware.stat().st_size,
              "included_files": included_count,
              "runtime_format": "mpy",
              "first_mpy_migration": diff_plan.first_mpy_migration,
              "excluded": ["docs/", "firmware/", ".github/", "tools/", "*.md", "config.py"],
          }
          update_manifest = {
              "version": os.environ["TAG_NAME"],
              "base_version": base_version,
              "channel": os.environ["RELEASE_CHANNEL"],
              "strategy": "tar-diff",
              "runtime_format": "mpy",
              "first_mpy_migration": diff_plan.first_mpy_migration,
              "archive": {
                  "name": update_archive,
                  "url": archive_url,
                  "size": archive_path.stat().st_size,
                  "sha256": archive_sha256,
              },
              "delete": sorted(set(list(diff_plan.delete_paths) + ["install.py"])),
          }
          web_install_manifest = {
              "name": "Ultimate Homebrewing Scale",
              "version": os.environ["TAG_NAME"],
              "new_install_prompt_erase": True,
              "builds": [
                  {
                      "chipFamily": "ESP32-S3",
                      "parts": [
                          {
                              "path": f"{web_download_base}/UHS-firmwareM5Dial.bin",
                              "offset": 0,
                          },
                      ],
                  },
              ],
          }
          Path("UHS-build-manifest.json").write_text(
              json.dumps(build_manifest, indent=2) + "\n",
              encoding="utf-8",
          )
          Path("uhs-update-manifest.json").write_text(
              json.dumps(update_manifest, indent=2) + "\n",
              encoding="utf-8",
          )
          Path("UHS-web-install-manifest.json").write_text(
              json.dumps(web_install_manifest, indent=2) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Upload repacked firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: UHS-firmware-${{ env.TAG_NAME }}
          if-no-files-found: error
          retention-days: 30
          path: |
            dist/out/UHS-firmwareM5Dial.bin
            dist/out/UHS-firmwareM5Dial.sha256
            dist/out/UHS-build-manifest.json
            dist/out/UHS-web-install-manifest.json
            dist/out/uhs-update-manifest.json
            dist/out/uhs-update-diff-${{ env.TAG_NAME }}.tar
            dist/out/UHS-app-files-${{ env.TAG_NAME }}.zip

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          name: UHS firmware ${{ env.TAG_NAME }}
          tag_name: ${{ env.TAG_NAME }}
          target_commitish: ${{ env.HEAD_SHA }}
          make_latest: ${{ env.PUBLISH_STABLE_LATEST }}
          prerelease: ${{ env.RELEASE_CHANNEL == 'prerelease' }}
          generate_release_notes: true
          files: |
            dist/out/UHS-firmwareM5Dial.bin
            dist/out/UHS-firmwareM5Dial.sha256
            dist/out/UHS-build-manifest.json
            dist/out/UHS-web-install-manifest.json
            dist/out/uhs-update-manifest.json
            dist/out/uhs-update-diff-${{ env.TAG_NAME }}.tar
            dist/out/UHS-app-files-${{ env.TAG_NAME }}.zip

  deploy_pages:
    name: Deploy stable firmware to GitHub Pages
    needs: repack
    if: needs.repack.outputs.publish_stable_latest == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout tagged commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.release.tag_name || inputs.tag_name || github.ref }}

      - name: Download repacked firmware artifact
        uses: actions/download-artifact@v4
        with:
          name: UHS-firmware-${{ needs.repack.outputs.tag_name }}
          path: dist/out

      - name: Prepare GitHub Pages files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/pages
          cp -R docs/. dist/pages/
          mkdir -p dist/pages/SoftwareInstallationGuide/latest
          cp dist/out/UHS-firmwareM5Dial.bin dist/pages/SoftwareInstallationGuide/latest/
          cp dist/out/UHS-web-install-manifest.json dist/pages/SoftwareInstallationGuide/latest/
          cp dist/out/UHS-firmwareM5Dial.sha256 dist/pages/SoftwareInstallationGuide/latest/
          cp dist/out/UHS-build-manifest.json dist/pages/SoftwareInstallationGuide/latest/

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/pages

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
