name: Deploy documentation

on:
  workflow_dispatch:
  # A merge to main republishes the site through the branch builder, which
  # serves docs/ verbatim and so drops SoftwareInstallationGuide/latest/.
  # Running here afterwards puts the web installer files back.
  push:
    branches: [main]
    paths:
      - docs/**
      - .github/workflows/deploy-docs.yml

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy-docs:
    name: Deploy docs from main
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout main documentation
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Prepare GitHub Pages files
        shell: bash
        run: |
          set -euo pipefail
          rm -rf dist/pages
          mkdir -p dist/pages
          cp -R docs/. dist/pages/

      # A Pages deployment replaces the whole site, so the web installer files
      # published by the release workflow have to be put back here. They are
      # taken from the newest stable release rather than from the live site:
      # reading the site back would only work while the files are already
      # online, so a single deployment that dropped them could never be undone.
      - name: Restore web installer files from the newest stable release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          latest_dir="dist/pages/SoftwareInstallationGuide/latest"
          mkdir -p "$latest_dir"

          tag="$(gh release list \
            --exclude-drafts --exclude-pre-releases \
            --limit 1 --json tagName --jq '.[0].tagName // empty')"
          if [ -z "$tag" ]; then
            echo "::error::No stable release to take the web installer files from." >&2
            exit 1
          fi
          echo "Restoring web installer files from $tag"

          files="UHS-firmwareM5Dial.bin UHS-web-install-manifest.json UHS-firmwareM5Dial.sha256 UHS-build-manifest.json"
          for file in $files; do
            gh release download "$tag" --dir "$latest_dir" --clobber --pattern "$file"
          done

          # Publishing a truncated firmware would brick the flash button, so
          # stop before deploying rather than shipping a partial set.
          for file in $files; do
            if [ ! -s "$latest_dir/$file" ]; then
              echo "::error::$tag does not carry $file." >&2
              exit 1
            fi
          done
          ls -l "$latest_dir"

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/pages

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
