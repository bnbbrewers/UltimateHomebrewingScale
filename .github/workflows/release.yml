name: Build a release from a tag

# A tag always produces a pre-release. Promoting it to a release is a separate,
# manual act, and that promotion is what publishes it to the site.
#
# One trigger only: creating a release from the GitHub UI also creates the tag
# and emits this same push event, so both gestures converge on a single run.
# Two triggers is what raced on v0.0.21 and dropped an asset.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag_name:
        description: Tag to build
        required: true

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.tag_name || github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build the firmware from a tag on main
    runs-on: ubuntu-latest

    steps:
      - name: Checkout tagged commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.tag_name || github.ref }}

      - name: Verify tag commit belongs to main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          HEAD_SHA=$(git rev-parse HEAD)
          git merge-base --is-ancestor "$HEAD_SHA" origin/main

      - name: Build pinned mpy-cross compiler
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .ci-mpy-cross
          mkdir -p .ci-mpy-cross
          git clone --depth 1 --branch 2.4.2 \
            https://github.com/m5stack/uiflow-micropython.git \
            .ci-mpy-cross/uiflow-micropython
          git -C .ci-mpy-cross/uiflow-micropython submodule update --init --depth 1 micropython
          make -C .ci-mpy-cross/uiflow-micropython/m5stack mpy-cross
          test -x .ci-mpy-cross/uiflow-micropython/micropython/mpy-cross/build/mpy-cross

      - name: Install ESP-IDF Python tools
        uses: espressif/install-esp-idf-action@v1
        with:
          version: v5.4.2

      - name: Prepare release names
        id: release_names
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG_NAME="${{ inputs.tag_name }}"
          else
            TAG_NAME="${GITHUB_REF_NAME}"
          fi
          echo "TAG_NAME=${TAG_NAME}" >> "$GITHUB_ENV"
          echo "HEAD_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          echo "SHORT_SHA=$(git rev-parse --short HEAD)" >> "$GITHUB_ENV"

      - name: Unpack repack base
        shell: bash
        run: |
          set -euo pipefail
          rm -rf dist
          mkdir -p dist/base dist/fs-user dist/out
          unzip -q firmware/UHS-m5dial-repack-base.zip -d dist/base
          test -f dist/base/repack-base/artifacts/sdkconfig
          test -f dist/base/repack-base/artifacts/bootloader/bootloader.bin
          test -f dist/base/repack-base/artifacts/partition_table/partition-table.bin
          test -f dist/base/repack-base/artifacts/nvs.bin
          test -f dist/base/repack-base/artifacts/micropython.bin
          test -f dist/base/repack-base/artifacts/fs-system.bin
          test -f dist/base/repack-base/tools/fs_packed.py
          test -f dist/base/repack-base/tools/littlefs2
          test -f dist/base/repack-base/tools/makeimg.py
          test -f dist/base/repack-base/version.txt
          test -f dist/base/repack-base/micropython/tools/uf2conv.py
          test -f dist/base/repack-base/micropython/tools/uf2families.json
          chmod +x dist/base/repack-base/tools/littlefs2

      - name: Build runtime file artifact
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/build_runtime.py \
            --source-root "$GITHUB_WORKSPACE" \
            --staging-root "$GITHUB_WORKSPACE/dist/fs-user" \
            --version "$TAG_NAME" \
            --mpy-cross "$GITHUB_WORKSPACE/.ci-mpy-cross/uiflow-micropython/micropython/mpy-cross/build/mpy-cross"
          test -f dist/fs-user/main.py
          test -f dist/fs-user/config.py.example
          test ! -e dist/fs-user/config.py
          [ ! -d dist/fs-user/docs ]
          [ ! -d dist/fs-user/firmware ]
          [ ! -d dist/fs-user/.github ]
          [ ! -d dist/fs-user/tools ]
          [ ! -f dist/fs-user/.gitignore ]
          if find dist/fs-user -type f -name "*.py" \
              ! -path "dist/fs-user/main.py" \
              ! -path "dist/fs-user/config.py.example" | grep -q .; then
            echo "Unexpected Python source in runtime staging." >&2
            find dist/fs-user -type f -name "*.py" >&2
            exit 1
          fi
          python3 - <<'PY'
          import os
          import tarfile
          from pathlib import Path

          src = Path("dist/fs-user")
          out = Path("dist/out") / ("UHS-app-files-%s.tar" % os.environ["TAG_NAME"])
          with tarfile.open(out, "w") as archive:
              for path in sorted(p for p in src.rglob("*") if p.is_file()):
                  archive.add(path, arcname=path.relative_to(src).as_posix())
          print("Runtime archive: %s (%d bytes)" % (out, out.stat().st_size))
          PY

      - name: Repack firmware
        shell: bash
        run: |
          set -euo pipefail
          cd dist/base/repack-base
          rm -f artifacts/fs-user.bin
          set +e
          python3 tools/fs_packed.py \
            tools/littlefs2 \
            dial \
            "$GITHUB_WORKSPACE/dist/fs-user" \
            artifacts/fs-user.bin \
            artifacts/partition_table/partition-table.bin 2>&1 | tee "$GITHUB_WORKSPACE/dist/out/fs-packed.log"
          FS_PACK_STATUS=${PIPESTATUS[0]}
          set -e
          if [ "$FS_PACK_STATUS" -ne 0 ]; then
            exit "$FS_PACK_STATUS"
          fi
          if grep -E "pack failed|write error|No more free space" "$GITHUB_WORKSPACE/dist/out/fs-packed.log"; then
            exit 1
          fi
          test -s artifacts/fs-user.bin
          python3 tools/makeimg.py \
            artifacts/sdkconfig \
            artifacts/bootloader/bootloader.bin \
            artifacts/partition_table/partition-table.bin \
            artifacts/nvs.bin \
            artifacts/micropython.bin \
            artifacts/fs-system.bin \
            artifacts/fs-user.bin \
            dial \
            0 \
            "$GITHUB_WORKSPACE/dist/out/UHS-firmwareM5Dial.bin" \
            "$GITHUB_WORKSPACE/dist/out/UHS-firmwareM5Dial.uf2"

      - name: Write release metadata
        shell: bash
        run: |
          set -euo pipefail
          cd dist/out
          sha256sum UHS-firmwareM5Dial.bin > UHS-firmwareM5Dial.sha256
          python3 - <<'PY'
          import hashlib
          import json
          import os
          import sys
          from pathlib import Path

          sys.path.insert(0, os.environ["GITHUB_WORKSPACE"])
          from tools.build_runtime import staged_files

          tag = os.environ["TAG_NAME"]
          firmware = Path("UHS-firmwareM5Dial.bin")
          sha256 = Path("UHS-firmwareM5Dial.sha256").read_text(encoding="utf-8").split()[0]
          archive_name = "UHS-app-files-%s.tar" % tag
          archive_path = Path(archive_name)
          files = staged_files(Path("../fs-user"))
          web_download_base = (
              "https://bnbbrewers.github.io/UltimateHomebrewingScale"
              "/SoftwareInstallationGuide/latest"
          )

          build_manifest = {
              "name": "Ultimate Homebrewing Scale M5Dial firmware",
              "tag": tag,
              "commit": os.environ["HEAD_SHA"],
              "short_commit": os.environ["SHORT_SHA"],
              "source_branch": "main",
              "firmware": "UHS-firmwareM5Dial.bin",
              "code": archive_name,
              "updater_manifest": "uhs-update-manifest.json",
              "web_install_manifest": "UHS-web-install-manifest.json",
              "web_install_url": "%s/UHS-web-install-manifest.json" % web_download_base,
              "sha256": sha256,
              "size": firmware.stat().st_size,
              "included_files": len(files),
              "runtime_format": "mpy",
              "excluded": ["docs/", "firmware/", ".github/", "tools/", "*.md", "config.py"],
          }
          # "channel" is read by nothing and goes stale on promotion. The
          # device takes its channel from its own configuration, and a
          # release's audience from GitHub's prerelease flag.
          update_manifest = {
              "version": tag,
              "strategy": "tar-full",
              "runtime_format": "mpy",
              "channel": "prerelease",
              "archive": {
                  "name": archive_name,
                  "url": (
                      "https://github.com/bnbbrewers/UltimateHomebrewingScale/"
                      "releases/download/%s/%s" % (tag, archive_name)
                  ),
                  "size": archive_path.stat().st_size,
                  "sha256": hashlib.sha256(archive_path.read_bytes()).hexdigest(),
              },
              "files": list(files),
          }
          web_install_manifest = {
              "name": "Ultimate Homebrewing Scale",
              "version": tag,
              "new_install_prompt_erase": True,
              "builds": [
                  {
                      "chipFamily": "ESP32-S3",
                      "parts": [
                          {"path": "%s/UHS-firmwareM5Dial.bin" % web_download_base, "offset": 0},
                      ],
                  },
              ],
          }
          Path("UHS-build-manifest.json").write_text(
              json.dumps(build_manifest, indent=2) + "\n", encoding="utf-8"
          )
          Path("uhs-update-manifest.json").write_text(
              json.dumps(update_manifest, indent=2) + "\n", encoding="utf-8"
          )
          Path("UHS-web-install-manifest.json").write_text(
              json.dumps(web_install_manifest, indent=2) + "\n", encoding="utf-8"
          )
          PY

      - name: Publish the pre-release
        uses: softprops/action-gh-release@v2
        with:
          name: UHS firmware ${{ env.TAG_NAME }}
          tag_name: ${{ env.TAG_NAME }}
          target_commitish: ${{ env.HEAD_SHA }}
          make_latest: false
          prerelease: true
          generate_release_notes: true
          files: |
            dist/out/UHS-firmwareM5Dial.bin
            dist/out/UHS-firmwareM5Dial.sha256
            dist/out/UHS-build-manifest.json
            dist/out/UHS-web-install-manifest.json
            dist/out/uhs-update-manifest.json
            dist/out/UHS-app-files-${{ env.TAG_NAME }}.tar
